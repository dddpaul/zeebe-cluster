# 2023-10-22: helm upgrade camunda camunda/camunda-platform --version 8.3.0
# 2023-10-24: helm upgrade camunda camunda/camunda-platform --version 8.3.1
# 2026-01-02: Updated to Camunda Platform 13.x with Zeebe 8.8.x

global:
  ingress:
    enabled: true
    className: nginx
    host: camunda.home.arpa
  security:
    authentication:
      method: basic
  elasticsearch:
    enabled: true

# Disable identity as part of the camunda platform core
identity:
  enabled: false

identityPostgresql:
  enabled: false

identityKeycloak:
  enabled: false

optimize:
  enabled: false

# Release label should match Helm release name
prometheusServiceMonitor:
  enabled: true
  labels:
    release: metrics

# Reduce for Zeebe and Gateway the configured replicas and with that the required resources
# to get it running locally
orchestration:
  contextPath: "/"
  ingress:
    grpc:
      enabled: true
      className: nginx
      host: zeebe.camunda.home.arpa
  home.arpa:
    home.arpa: camunda/camunda
    tag: "8.8.8"
  clusterSize: "3"
  partitionCount: "6"
  replicationFactor: "3"
  cpuThreadCount: "4"
  ioThreadCount: "2"
  index:
    replicas: 1
  exporters:
    camunda:
      enabled: true
    zeebe:
      enabled: false
  security:
    authentication:
      unprotectedApi: true
    authorizations:
      enabled: false
  resources:
    requests:
      cpu: 6000m
      memory: 16000Mi
    limits:
      cpu: 6000m
      memory: 16000Mi
  pvcSize: 5Gi
  persistenceType: memory
  javaOpts: >-
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/usr/local/camunda/data
    -XX:ErrorFile=/usr/local/camunda/data/zeebe_error%p.log
    -XX:+ExitOnOutOfMemoryError
    -XX:+UseShenandoahGC
    -Dcom.sun.management.jmxremote
    -Dcom.sun.management.jmxremote.port=1099
    -Dcom.sun.management.jmxremote.rmi.port=1100
    -Djava.rmi.server.hostname=192.168.0.100
    -Dcom.sun.management.jmxremote.ssl=false
    -Dcom.sun.management.jmxremote.authenticate=false
  readinessProbe:
    probePath: /actuator/health/readiness
  nodeSelector:
    camunda/app: broker

  env:
    - name: TZ
      value: "Europe/Moscow"

    # K8S dynamic variables (must stay as env vars)
    - name: ZEEBE_BROKER_NETWORK_ADVERTISEDHOST
      value: "$(K8S_NAME).$(K8S_SERVICE_NAME)"
    - name: ZEEBE_BROKER_CLUSTER_INITIALCONTACTPOINTS
      value: "$(K8S_SERVICE_NAME)-0.$(K8S_SERVICE_NAME):26502,$(K8S_SERVICE_NAME)-1.$(K8S_SERVICE_NAME):26502,$(K8S_SERVICE_NAME)-2.$(K8S_SERVICE_NAME):26502"

    # Unified config (camunda.* prefix) - no deprecation warnings
    - name: CAMUNDA_DATA_SNAPSHOTPERIOD
      value: "1m"
    - name: CAMUNDA_CLUSTER_RAFT_FLUSHENABLED
      value: "true"
    - name: CAMUNDA_CLUSTER_RAFT_FLUSHDELAY
      value: "0s"
    - name: CAMUNDA_DATA_PRIMARYSTORAGE_ROCKSDB_WALDISABLED
      value: "true"

    # Backpressure settings (check if unified equivalent exists, otherwise keep legacy)
    - name: ZEEBE_BROKER_BACKPRESSURE_ENABLED
      value: "false"
    - name: ZEEBE_BROKER_BACKPRESSURE_ALGORITHM
      value: "aimd"
    - name: ZEEBE_BROKER_BACKPRESSURE_AIMD_INITIALLIMIT
      value: "1000"
    - name: ZEEBE_BROKER_BACKPRESSURE_AIMD_MINLIMIT
      value: "100"
    - name: ZEEBE_BROKER_BACKPRESSURE_AIMD_MAXLIMIT
      value: "2000"

    # Experimental features (check if unified equivalent exists)
    - name: ZEEBE_BROKER_EXPERIMENTAL_FEATURES_ENABLEACTORMETRICS
      value: "true"
    - name: ZEEBE_BROKER_EXPERIMENTAL_FEATURES_ENABLEYIELDINGDUEDATECHECKER
      value: "true"
    - name: ZEEBE_BROKER_PROCESSING_ENABLEASYNCSCHEDULEDTASKS
      value: "true"

    # Exporter settings - retention is under history, use correct path
    - name: ZEEBE_BROKER_EXPORTERS_CAMUNDAEXPORTER_ARGS_INDEX_NUMBEROFSHARDS
      value: "6"
    - name: CAMUNDA_DATABASE_INDEX_NUMBEROFSHARDS
      value: "6"
    - name: ZEEBE_BROKER_EXPORTERS_CAMUNDAEXPORTER_ARGS_INDEX_NUMBEROFREPLICAS
      value: "0"
    - name: CAMUNDA_DATABASE_INDEX_NUMBEROFREPLICAS
      value: "0"
    - name: ZEEBE_BROKER_EXPORTERS_CAMUNDAEXPORTER_ARGS_BULK_DELAY
      value: "10"
    - name: ZEEBE_BROKER_EXPORTERS_CAMUNDAEXPORTER_ARGS_BULK_SIZE
      value: "10000"
    - name: ZEEBE_BROKER_EXPORTERS_CAMUNDAEXPORTER_ARGS_HISTORY_ROLLOVERINTERVAL
      value: "1d"
    - name: ZEEBE_BROKER_EXPORTERS_CAMUNDAEXPORTER_ARGS_HISTORY_ELSROLLOVERDATEFORMAT
      value: "yyyy-MM-dd"
    - name: ZEEBE_BROKER_EXPORTERS_CAMUNDAEXPORTER_ARGS_HISTORY_RETENTION_ENABLED
      value: "true"
    - name: ZEEBE_BROKER_EXPORTERS_CAMUNDAEXPORTER_ARGS_HISTORY_RETENTION_MINIMUMAGE
      value: "2h"

  service:
    extraPorts:
      - name: jmx
        protocol: TCP
        port: 1099
        targetPort: 1099
      - name: rmi
        protocol: TCP
        port: 1100
        targetPort: 1100

# Use values for inbound mode from here https://github.com/camunda/camunda-platform-helm/issues/976
connectors:
  enabled: false
  inbound:
    mode: "credentials"
    auth:
      existingSecret: "demo"
  image:
    repository: camunda/connectors-bundle
    tag: "8.8.2"
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: 500Mi
    limits:
      cpu: "1000m"
      memory: 1000Mi
  nodeSelector:
    camunda/app: connectors
  env:
    - name: CAMUNDA_OPERATE_CLIENT_USERNAME
      value: "demo"
    - name: CAMUNDA_OPERATE_CLIENT_PASSWORD
      value: "demo"

# Disable tasklist (we don't need user tasks)
tasklist:
  enabled: false

# Configure elastic search to make it running for local development
elasticsearch:
  enabled: true
  image:
    repository: bitnamilegacy/elasticsearch
    tag: 8.18.0
  master:
    masterOnly: false
    replicaCount: 3
    heapSize: 768m
    persistence:
      size: 15Gi
    nodeSelector:
      camunda/app: elasticsearch
    resources:
      requests:
        cpu: "2000m"
        memory: "3000M"
      limits:
        cpu: "2000m"
        memory: "3000M"
  extraEnvVars:
    - name: TZ
      value: "Europe/Moscow"
