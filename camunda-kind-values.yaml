# 2023-10-22: helm upgrade camunda camunda/camunda-platform --version 8.3.0
# 2023-10-24: helm upgrade camunda camunda/camunda-platform --version 8.3.1
# 2026-01-02: Updated to Camunda Platform 13.x with Zeebe 8.8.x

global:
  ingress:
    enabled: true
    className: nginx
    host: camunda.home.arpa
  security:
    authentication:
      method: basic
  elasticsearch:
    enabled: true

# Disable identity as part of the camunda platform core
identity:
  enabled: false

identityPostgresql:
  enabled: false

identityKeycloak:
  enabled: false

optimize:
  enabled: false

# Release label should match Helm release name
prometheusServiceMonitor:
  enabled: true
  labels:
    release: metrics

orchestration:
  contextPath: "/"
  ingress:
    grpc:
      enabled: true
      className: nginx
      host: zeebe.camunda.home.arpa
  image:
    repository: camunda/camunda
    tag: "8.8.8"
  resources:
    requests:
      cpu: 6000m
      memory: 16000Mi
    limits:
      cpu: 6000m
      memory: 16000Mi
  pvcSize: 5Gi
  persistenceType: memory
  javaOpts: >-
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/usr/local/camunda/data
    -XX:ErrorFile=/usr/local/camunda/data/zeebe_error%p.log
    -XX:+ExitOnOutOfMemoryError
    -XX:+UseShenandoahGC
    -Dcom.sun.management.jmxremote
    -Dcom.sun.management.jmxremote.port=1099
    -Dcom.sun.management.jmxremote.rmi.port=1100
    -Djava.rmi.server.hostname=192.168.0.100
    -Dcom.sun.management.jmxremote.ssl=false
    -Dcom.sun.management.jmxremote.authenticate=false
  readinessProbe:
    probePath: /actuator/health/readiness
  nodeSelector:
    camunda/app: broker
  # extraVolumes:
  #   - name: runtime
  #     emptyDir:
  #       medium: "Memory"
  # extraVolumeMounts:
  #   - name: runtime
  #     mountPath: /usr/local/zeebe/runtime
  service:
    extraPorts:
      - name: jmx
        protocol: TCP
        port: 1099
        targetPort: 1099
      - name: rmi
        protocol: TCP
        port: 1100
        targetPort: 1100

  # Dynamic K8S variables must stay as env vars (runtime substitution)
  env:
    - name: TZ
      value: "Europe/Moscow"
    # These use K8S downward API - must remain as env vars
    - name: ZEEBE_BROKER_NETWORK_ADVERTISEDHOST
      value: "$(K8S_NAME).$(K8S_SERVICE_NAME)"
    - name: ZEEBE_BROKER_CLUSTER_INITIALCONTACTPOINTS
      value: "$(K8S_SERVICE_NAME)-0.$(K8S_SERVICE_NAME):26502,$(K8S_SERVICE_NAME)-1.$(K8S_SERVICE_NAME):26502,$(K8S_SERVICE_NAME)-2.$(K8S_SERVICE_NAME):26502"

  # ALL broker and camunda configuration in YAML format
  configuration: |
    zeebe:
      broker:
        gateway:
          enable: true
          network:
            port: 26500
          security:
            enabled: false
        cluster:
          clusterSize: 3
          partitionsCount: 6
          replicationFactor: 3
          raft:
            flush:
              enabled: true
              delayTime: "0s"
        threads:
          cpuThreadCount: 4
          ioThreadCount: 2
        data:
          snapshotPeriod: "1m"
          # runtimeDirectory: "runtime"
        backpressure:
          enabled: false
          algorithm: "aimd"
          aimd:
            initialLimit: 1000
            minLimit: 100
            maxLimit: 2000
        processing:
          enableAsyncScheduledTasks: true
        experimental:
          rocksdb:
            disableWal: true
          features:
            enableActorMetrics: true
            enableYieldingDueDateChecker: true
        exporters:
          camundaExporter:
            className: io.camunda.exporter.CamundaExporter
            args:
              connect:
                type: elasticsearch
                url: http://elasticsearch:9200
                dateFormat: "yyyy-MM-dd'T'HH:mm:ss.SSSZZ"
                socketTimeout: 1000
                connectTimeout: 1000
              bulk:
                delay: 5
                size: 1000
              index:
                numberOfShards: 1
                numberOfReplicas: 1
              history:
                elsRolloverDateFormat: "date"
                rolloverBatchSize: 100
                waitPeriodBeforeArchiving: "1h"
                delayBetweenRuns: 2000
                maxDelayBetweenRuns: 60000
    camunda:
      security:
        authentication:
          unprotectedApi: true
        authorizations:

# Use values for inbound mode from here https://github.com/camunda/camunda-platform-helm/issues/976
connectors:
  enabled: false
  inbound:
    mode: "credentials"
    auth:
      existingSecret: "demo"
  image:
    repository: camunda/connectors-bundle
    tag: "8.8.2"
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: 500Mi
    limits:
      cpu: "1000m"
      memory: 1000Mi
  nodeSelector:
    camunda/app: connectors
  env:
    - name: CAMUNDA_OPERATE_CLIENT_USERNAME
      value: "demo"
    - name: CAMUNDA_OPERATE_CLIENT_PASSWORD
      value: "demo"

# Disable tasklist (we don't need user tasks)
tasklist:
  enabled: false

# Configure elastic search to make it running for local development
elasticsearch:
  enabled: true
  image:
    repository: bitnamilegacy/elasticsearch
    tag: 8.18.0
  master:
    masterOnly: false
    replicaCount: 3
    heapSize: 768m
    persistence:
      size: 15Gi
    nodeSelector:
      camunda/app: elasticsearch
    resources:
      requests:
        cpu: "2000m"
        memory: "3000M"
      limits:
        cpu: "2000m"
        memory: "3000M"
  extraEnvVars:
    - name: TZ
      value: "Europe/Moscow"
