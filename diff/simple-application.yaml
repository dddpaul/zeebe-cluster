spring:
  profiles:
    active: "broker,identity,operate,tasklist,consolidated-auth"
  servlet:
    multipart:
      max-file-size: "10MB"
      max-request-size: "10MB"

server:
  address: 0.0.0.0
  port: 8080

management:
  server:
    address: 0.0.0.0
    port: 9600
    base-path: "/"

camunda:
  license:
    key: "${VALUES_ORCHESTRATION_LICENSE_KEY}"

  system:
    cpu-thread-count: 3
    io-thread-count: 3
    clock-controlled: false
    validate-restore-config: true
    upgrade:
      enable-version-check: true


  cluster:
    # The Node ID depends on the StatefulSet Pod's name so it cannot be templated in the StatefulSet level.
    # The value of "node-id" is calculated in the "startup.sh" file and exported as "VALUES_ORCHESTRATION_NODE_ID" env var.
    node-id: "${VALUES_ORCHESTRATION_NODE_ID:}"
    size: "3"
    replication-factor: "3"
    partition-count: "3"

  api:
    grpc:
      address: 0.0.0.0
      port: 26500

  # Database configuration - Separated syntax.
  database:
    index:
      numberOfReplicas: "1"

  data:
    snapshot-period: "5m"
    primary-storage:
      disk:
        free-space:
          processing: "2GB"
          replication: "1GB"
    secondary-storage:
      autoconfigure-camunda-exporter: true
      type: "elasticsearch"
      elasticsearch:
        url: "http://camunda-elasticsearch:9200"
        cluster-name: "elasticsearch"
        username: ""
        password: "${VALUES_ELASTICSEARCH_PASSWORD:}"
        index-prefix: ""

  # Security configuration - Separated syntax.
  security:
    authentication:
      method: "basic"
      unprotectedApi: false
    authorizations:
      enabled: true
    initialization:
      default-roles:
        admin:
          mappingRules: []
          users:
          - demo
        connectors:
          clients:
          - connectors
          mappingRules: []
          users:
          - connectors
      users:
        - email: connector@demo.com
          name: Connector User
          password: connector
          username: connectors
        - email: demo@demo.com
          name: Demo User
          password: demo
          username: demo
    multiTenancy:
      checksEnabled: false
      apiEnabled: true

  #
  # Camunda Operate Configuration - Separated syntax.
  #
  operate:
    persistentSessionsEnabled: true
    multiTenancy:
      enabled: false
    # Zeebe instance
    zeebe:
      # Gateway address
      gatewayAddress: "camunda-zeebe-gateway:26500"

  #
  # Camunda Tasklist Configuration - Separated syntax.
  #
  tasklist:
    multiTenancy:
      enabled: false
    # Zeebe instance
    zeebe:
      # Gateway address
      gatewayAddress: "camunda-zeebe-gateway:26500"
      restAddress: "http://camunda-zeebe-gateway:8080"

#
# Camunda Zeebe Configuration - Separated syntax.
#
zeebe:
  host: 0.0.0.0
  log:
    level: "info"

  broker:
    # zeebe.broker.gateway
    gateway:
      enable: true
      multitenancy:
        enabled: false

    # zeebe.broker.network
    network:
      advertisedHost: "${K8S_NAME}.${K8S_SERVICE_NAME}"
      host: 0.0.0.0
      commandApi:
        port: 26501
      internalApi:
        port: 26502

    # zeebe.broker.cluster
    cluster:
      initialContactPoints:
        - camunda-zeebe-0.${K8S_SERVICE_NAME}:26502
        - camunda-zeebe-1.${K8S_SERVICE_NAME}:26502
        - camunda-zeebe-2.${K8S_SERVICE_NAME}:26502
      clusterName: camunda-zeebe

    # zeebe.broker.exporters
    exporters:
      camundaexporter:
        className: "io.camunda.exporter.CamundaExporter"
        args:
          connect:
            type: "elasticsearch"
            url: "http://camunda-elasticsearch:9200"
            awsEnabled: false
          history:
            elsRolloverDateFormat: "date"
            rolloverInterval: "1d"
            rolloverBatchSize: 100
            waitPeriodBeforeArchiving: "1h"
            delayBetweenRuns: 2000
            maxDelayBetweenRuns: 60000
